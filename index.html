<!doctype html>
<html lang="en" data-brand="portfolio">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Petri Jomppanen, product designer focused on design systems, multi-brand systems and complex, data-heavy products."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Petri Jomppanen, Product Designer</title>
    <script>
      // Apply the saved theme before first paint. No saved choice = follow the OS.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
